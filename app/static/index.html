<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="blue" data-density="comfortable" data-anim="normal" data-bg="mesh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CloudOps AI — Grounded knowledge assistant powered by Confluence and Vertex AI" />
  <title>CloudOps AI — Knowledge Assistant</title>

  <!-- FIX: preconnect both Google Fonts domains to prevent FOIT -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>

<!-- FIX: aria-hidden on all decorative background elements -->
<div class="bg-wrap" aria-hidden="true">
  <div class="bg-mesh"></div>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>
  <canvas id="bg-canvas"></canvas>
</div>

<!-- App Shell -->
<div class="app-shell">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Conversation history">
    <div class="sidebar-top">
      <div class="sidebar-brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </div>
        <span class="brand-text">CloudOps AI</span>
      </div>
      <button class="icon-btn sidebar-close-btn" id="sidebar-close" title="Close sidebar" aria-label="Close sidebar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <button class="new-chat-btn" id="new-chat-btn" aria-label="Start new conversation">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Chat
    </button>

    <div class="history-section">
      <div class="history-label" id="history-label">Recent</div>
      <!-- FIX: Empty state is rendered by JS, not hard-coded here to prevent double-render flash -->
      <div id="history-list" class="history-list" role="list" aria-labelledby="history-label"></div>
    </div>

    <div class="sidebar-footer">
      <div class="footer-status">
        <span class="status-dot" aria-hidden="true"></span>
        <span>System Connected</span>
      </div>
      <div class="footer-meta">Knowledge Base Synchronized</div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-col" id="main-col">

    <!-- Top Bar -->
    <header class="topbar" role="banner">
      <div class="topbar-left">
        <!-- FIX: sidebar-open-btn, visibility managed purely by JS via .visible class -->
        <button class="icon-btn topbar-menu-btn" id="sidebar-open-btn" title="Open history" aria-label="Open conversation history" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/>
          </svg>
        </button>
        <div class="topbar-title">
          <span class="topbar-name">CloudOps AI</span>
          <span class="topbar-badge" aria-label="Grounded Knowledge">Grounded Runbooks</span>
        </div>
      </div>

      <div class="topbar-actions" role="toolbar" aria-label="Toolbar actions">
        <button class="icon-btn" id="theme-toggle" title="Toggle light/dark theme" aria-label="Toggle theme">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="icon-btn accent-pulse" id="customize-btn" title="Customize appearance" aria-label="Customize appearance" aria-haspopup="dialog">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
        </button>
        <button class="icon-btn" id="clear-btn" title="Clear current chat" aria-label="Clear current chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
        </button>
      </div>
    </header>

    <!-- Chat Area -->
    <div class="chat-area" id="chat-area" role="main" aria-live="polite" aria-label="Conversation">
      <!-- Welcome screen injected by JS -->
    </div>

    <!-- Input Zone -->
    <div class="input-zone" role="contentinfo">
      <form id="chat-form" class="input-form" novalidate>
        <div class="input-card" id="input-card">
          <textarea
            id="user-input"
            placeholder="Ask any CloudOps, GCP, or AWS operational question..."
            rows="1"
            autocomplete="off"
            spellcheck="true"
            aria-label="Your question"
            aria-multiline="true"
          ></textarea>
          <div class="input-actions">
            <span class="char-hint" id="char-hint" aria-live="polite"></span>
            <button type="submit" id="send-btn" class="send-btn" title="Send message (Enter)" aria-label="Send message">
              <!-- FIX: Added translate for pixel-perfect icon centering -->
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="transform: translate(1px, -1px)" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </div>
      </form>
      <div class="input-footer-row" aria-hidden="true">
        <div class="input-meta">
          <span class="meta-dot"></span>
          Confluence Grounded &nbsp;·&nbsp; Enterprise Guardrails &nbsp;·&nbsp; Real-time AI
        </div>
        <div class="kbd-hint">Enter to send &nbsp;·&nbsp; Shift+Enter for newline</div>
      </div>
    </div>
  </main>
</div>

<!-- CUSTOMIZATION PANEL -->
<div class="customize-panel" id="customize-panel" role="dialog" aria-modal="true" aria-label="Appearance settings">
  <div class="customize-header">
    <span>Appearance</span>
    <button class="icon-btn" id="customize-close" aria-label="Close appearance settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <div class="cp-section">
    <div class="cp-label">Accent Color</div>
    <div class="color-swatches" role="group" aria-label="Accent color options">
      <button class="swatch active" data-accent="blue"    title="Blue"    aria-label="Blue accent"    style="--c:#3b82f6"></button>
      <button class="swatch"        data-accent="violet"  title="Violet"  aria-label="Violet accent"  style="--c:#7c3aed"></button>
      <button class="swatch"        data-accent="rose"    title="Rose"    aria-label="Rose accent"    style="--c:#e11d48"></button>
      <button class="swatch"        data-accent="emerald" title="Emerald" aria-label="Emerald accent" style="--c:#059669"></button>
      <button class="swatch"        data-accent="amber"   title="Amber"   aria-label="Amber accent"   style="--c:#d97706"></button>
      <button class="swatch"        data-accent="cyan"    title="Cyan"    aria-label="Cyan accent"    style="--c:#0891b2"></button>
      <button class="swatch"        data-accent="indigo"  title="Indigo"  aria-label="Indigo accent"  style="--c:#4338ca"></button>
      <button class="swatch"        data-accent="pink"    title="Pink"    aria-label="Pink accent"    style="--c:#db2777"></button>
    </div>
  </div>

  <div class="cp-section">
    <div class="cp-label">Chat Density</div>
    <div class="cp-pills" role="group" aria-label="Chat density options">
      <button class="cp-pill" data-density="compact">Compact</button>
      <button class="cp-pill active" data-density="comfortable">Comfortable</button>
      <button class="cp-pill" data-density="spacious">Spacious</button>
    </div>
  </div>

  <div class="cp-section">
    <!-- FIX: Font size now only affects content, not all chrome -->
    <div class="cp-label">Content Font Size &nbsp;<span id="font-size-val">15px</span></div>
    <input type="range" id="font-size-slider" min="12" max="20" value="15" class="cp-range" aria-label="Content font size" aria-valuemin="12" aria-valuemax="20" />
  </div>

  <div class="cp-section">
    <div class="cp-label">Animations</div>
    <div class="cp-pills" role="group" aria-label="Animation speed options">
      <button class="cp-pill" data-anim="fast">Fast</button>
      <button class="cp-pill active" data-anim="normal">Normal</button>
      <button class="cp-pill" data-anim="slow">Slow</button>
      <button class="cp-pill" data-anim="none">None</button>
    </div>
  </div>

  <div class="cp-section">
    <div class="cp-label">Background Style</div>
    <div class="cp-pills" role="group" aria-label="Background style options">
      <button class="cp-pill active" data-bg="mesh">Mesh</button>
      <button class="cp-pill" data-bg="particles">Particles</button>
      <button class="cp-pill" data-bg="waves">Waves</button>
      <button class="cp-pill" data-bg="minimal">Minimal</button>
    </div>
  </div>

  <button class="cp-reset" id="cp-reset">Reset to defaults</button>
</div>
<div class="customize-overlay" id="customize-overlay" aria-hidden="true"></div>

<!-- FIX: marked.js moved to end of body — no longer blocks first paint -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
<script src="/static/app.js" defer></script>
</body>
</html>
